name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install public Quarry declared-input API
        if: matrix.python-version != '3.10'
        run: pip install 'git+https://github.com/cisco-ai-defense/project-quarry.git@9c5db4aa7cf843e1e2a78bf973fe106a30d446a0'

      - name: Run tests
        run: pytest --cov=aidefense_langchain --cov-report=term-missing
